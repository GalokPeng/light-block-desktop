name: C++ preview checks
on:
  pull_request:
    branches: [cpp-preview]
  push:
    branches: [cpp-preview]
permissions:
  contents: read
jobs:
  tests:
    name: Windows tests
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Build complete C++ runtime
        shell: pwsh
        run: |
          python tools/test_release_protocol.py
          if ($LASTEXITCODE -ne 0) { throw 'Preview release isolation contract failed.' }
          ./build.ps1
      - name: Native and Qt regressions
        shell: pwsh
        run: ./tools/test.ps1 -SkipBuild
      - run: node --test tests/test_website_downloads.mjs tests/test_website_theme.mjs tests/test_preview_download.mjs
      - name: Verify curated wallpaper metadata
        run: python tools/check_wallpaper_catalog.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpp-test-evidence
          path: .local/test-*/
          if-no-files-found: warn
          retention-days: 14
