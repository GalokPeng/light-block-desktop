name: Stable release
on:
  push:
    branches: [main, cpp-preview]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified stable version (main or its exact version tag only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  plan:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cpp-preview' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - id: plan
        shell: pwsh
        env:
          REQUEST_PUBLISH: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || inputs.publish) }}
        run: |
          $version = python tools/release.py version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid app version.' }
          $eligible = python tools/release.py plan
          if ($LASTEXITCODE -ne 0) { throw 'Invalid version progression.' }
          $expectedTag = python tools/release.py tag
          if ($LASTEXITCODE -ne 0) { throw 'Invalid stable tag.' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne $expectedTag) { throw 'Tag and app version disagree.' }
          $publish = $eligible -eq 'true' -and $env:REQUEST_PUBLISH -eq 'true'
          $build = $true
          $scope = if ($version -eq '2.0.6') { 'organizer' } else { 'full' }
          "scope=$scope" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$($build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  package:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      LIGHTBLOCK_TEST_SCOPE: ${{ needs.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: recorder-cache
        with:
          path: build/recording-runtime
          key: windows-2022-recorder-v1-${{ hashFiles('tools/build_recording_runtime.py', 'tools/build_ffmpeg.sh', 'tools/validate_recording_runtime.py') }}
      - name: Build C++ and pinned dependencies from clean checkout
        shell: pwsh
        run: |
          python tools/test_release_protocol.py
          if ($LASTEXITCODE -ne 0) { throw 'Stable release contract failed.' }
          ./build.ps1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.recorder-cache.outputs.cache-hit != 'true'
        with:
          path: build/recording-runtime
          key: ${{ steps.recorder-cache.outputs.cache-primary-key }}
      - name: Native, media and Qt regression gate
        shell: pwsh
        # Hosted workers have no guaranteed visible MF presentation surface.
        # Decode real frames through the shipped fallback; local tests keep MF.
        run: |
          if ($env:LIGHTBLOCK_TEST_SCOPE -eq 'organizer') {
            ./tools/test_organizer.ps1
          } else {
            ./tools/test_taskbar.ps1 -CompilerRoot "$PWD/build/native-toolchain/Compiler"
            ./tools/test.ps1 -SkipBuild -VideoProbeBackend qt-ffmpeg
          }
      - if: needs.plan.outputs.scope != 'organizer'
        run: node --test tests/test_website_downloads.mjs tests/test_website_theme.mjs tests/test_preview_download.mjs
      - name: Verify curated wallpaper metadata
        if: needs.plan.outputs.scope != 'organizer'
        run: python tools/check_wallpaper_catalog.py
      - name: Build upgrade-compatible Setup and corresponding source assets
        shell: pwsh
        run: ./tools/release.ps1 -SkipBuild -SkipTests
      - name: Isolated localized install, upgrade and uninstall
        if: needs.plan.outputs.scope != 'organizer'
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" }
          python tools/test_setup.py --iscc $iscc
          if ($LASTEXITCODE -ne 0) { throw 'Setup regression failed.' }
          python tools/test_update_flow.py --iscc $iscc
          if ($LASTEXITCODE -ne 0) { throw 'In-app update regression failed.' }
          python tools/release.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Release checksum verification failed.' }
      - name: Build MSIX for manual Partner Center submission
        id: store
        if: needs.plan.outputs.publish == 'true' || (vars.STORE_IDENTITY_NAME != '' && github.ref != 'refs/heads/cpp-preview')
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_IDENTITY_PUBLISHER: ${{ vars.STORE_IDENTITY_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python tools/build_store_msix.py --output release
          if ($LASTEXITCODE -ne 0) { throw 'Store package build failed.' }
          $name = "Qingkuai-v$env:APP_VERSION-x64.msix"
          $hash = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath "release/Qingkuai-v$env:APP_VERSION-SHA256SUMS.txt" -Value "$hash  $name" -Encoding ascii
          python tools/release.py verify --require-store
          if ($LASTEXITCODE -ne 0) { throw 'Store release checksum verification failed.' }
      - name: Upload Microsoft Store package
        if: steps.store.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-${{ needs.plan.outputs.version }}-x64
          path: release/Qingkuai-v${{ needs.plan.outputs.version }}-x64.msix
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-${{ needs.plan.outputs.version }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
      - name: Preserve build and installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-evidence
          include-hidden-files: true
          path: |
            .local/test-*/
            build/setup-checks.json
            build/update-flow-qa/
            build/package-smoke-evidence/
            build/recording-runtime-checks.json
            build/recording-runtime/configure.log
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-${{ needs.plan.outputs.version }}
          path: release
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python tools/release.py verify --require-store
          if ($LASTEXITCODE -ne 0) { throw 'Published artifact validation failed.' }
          $tag = "v$env:APP_VERSION"
          $sumFile = Join-Path release "Qingkuai-v$env:APP_VERSION-SHA256SUMS.txt"
          $assets = foreach ($line in Get-Content -LiteralPath $sumFile) { $hash, $name = $line -split '  ',2; Join-Path release $name }
          $changes = Get-Content -LiteralPath CHANGES.md -Raw
          $pattern = '(?ms)^# v' + [regex]::Escape($env:APP_VERSION) + '\b.*?(?=^# v|\z)'
          $notes = [regex]::Match($changes,$pattern)
          if (-not $notes.Success) { throw 'Missing release notes.' }
          $notesFile = Join-Path release 'RELEASE_NOTES.md'
          [IO.File]::WriteAllText($notesFile,$notes.Value.Trim()+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          # The original 1.0.0 branch/tag and release remain available for rollback.
          $archive = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/python-v1.0.0" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $archive -ne '799ac705a9a476333dbe9efcac93fdfc6d65c215') { throw 'Archived v1.0.0 branch changed.' }
          $legacy = gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets | length'
          if ($LASTEXITCODE -ne 0 -or [int]$legacy -lt 2) { throw 'v1.0.0 download assets are missing.' }
          gh release create $tag @assets $sumFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "轻块桌面 v$env:APP_VERSION" --notes-file $notesFile --latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect existing draft/tag before retry.' }
          $published = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isPrerelease --jq '.isPrerelease'
          if ($LASTEXITCODE -ne 0 -or $published -ne 'false') { throw 'Expected a stable release.' }
          $storeName = "Qingkuai-v$env:APP_VERSION-x64.msix"
          $storeDigest = (Get-FileHash -LiteralPath "release/$storeName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the published Store package.' }
          $storeAsset = @(($releaseJson | ConvertFrom-Json).assets | Where-Object name -eq $storeName)
          if ($storeAsset.Count -ne 1 -or $storeAsset[0].digest -ne "sha256:$storeDigest") {
            throw 'The public release is missing its verified Store package.'
          }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest -ne $tag) { throw 'Latest release did not advance.' }
