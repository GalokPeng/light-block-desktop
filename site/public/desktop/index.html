<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>轻块桌面 · Desktop demo</title>
<link rel="modulepreload" href="./desktop.mjs">
<link rel="modulepreload" href="./ui.mjs">
<link rel="modulepreload" href="./pointer.mjs">
<link rel="modulepreload" href="./capture.mjs">
<link rel="modulepreload" href="./studio.mjs">
<link rel="modulepreload" href="./catalog.mjs">
<link rel="stylesheet" href="./desktop.css">
<script type="module" src="./desktop.mjs"></script>
</head>
<body>
<main id="desk" tabindex="-1">
  <div id="scene"><img id="wall" src="/media/wallpapers/mountain-bay.webp" alt=""><video id="movie" muted loop playsinline hidden></video></div>
  <div id="files"></div>
  <div id="workspace"><section id="app" class="window">
    <div class="titlebar"><span class="brandmark"><img src="/media/icon.png" alt=""><b id="product"></b></span><span id="win-actions"></span></div>
    <div class="layout"><nav id="rail"></nav><div class="content" id="content" aria-busy="true"><span class="boot" role="status">正在打开轻块桌面…</span></div></div>
  </section>
  <div id="stickies"></div>
  <div id="results"></div></div>
  <div id="bar"></div>
  <div id="toast" role="status" data-html2canvas-ignore></div>
  <div id="capture-layer" hidden data-html2canvas-ignore></div>
  <div id="rec-state" hidden data-html2canvas-ignore></div>
</main>
<!-- deployment-assets -->
<script>if(new URLSearchParams(location.search).get('lang')==='en')document.querySelector('.boot').textContent='Opening Light Block Desktop…';</script>
<noscript><p>在线体验需要 JavaScript。 Enable JavaScript for the desktop demo.</p></noscript>
</body></html>
